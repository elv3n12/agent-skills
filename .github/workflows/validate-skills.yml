name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/validate-skills.py
      - run: python scripts/package-beatgrove-plugin.py --output /tmp/beatgrove-building-studio.zip
